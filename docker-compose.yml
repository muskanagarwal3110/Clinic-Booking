services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: clinic
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: clinic_test
    ports: ["5433:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
